<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saurabh Saini - Digital Business Card</title>
    <meta name="description" content="Digital business card for Saurabh Saini.">
    
    <!-- PWA / Mobile App Meta Tags -->
    <link rel="manifest" href="manifest.json?v=4">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

    <!-- Inline Critical CSS for maximum performance -->
    <style>
        :root {
            /* Light Theme (Default) */
            --bg-color: #f3f4f6; /* Subtle off-white background */
            --surface-color: #ffffff;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --accent-color: #111827; /* Dark accent for high contrast */
            --accent-hover: #374151;
            --accent-text: #ffffff;
            --btn-bg: #f9fafb;
            --btn-hover: #e5e7eb;
            --border-color: #e5e7eb;
        }

        /* Auto Dark Mode Support */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f1115; /* Deep dark background */
                --surface-color: #181b21;
                --text-primary: #f9fafb;
                --text-secondary: #9ca3af;
                --accent-color: #f9fafb; /* Light accent for dark mode */
                --accent-hover: #e5e7eb;
                --accent-text: #111827;
                --btn-bg: #22262e;
                --btn-hover: #2d333b;
                --border-color: #2d333b;
            }
        }

        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            /* System fonts for zero-latency loading */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* Mobile viewport height fix */
            padding: 16px;
            overflow: hidden; /* Prevent scrolling for app-like feel */
        }

        /* Card Layout */
        .card {
            background-color: var(--surface-color);
            border-radius: 28px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 0 2px rgba(0, 0, 0, 0.03);
            width: 100%;
            max-width: 420px;
            padding: 40px 24px;
            text-align: center;
            border: 1px solid var(--border-color);
            max-height: 100%;
            overflow-y: auto; /* Fallback for very small screens */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .card::-webkit-scrollbar {
            display: none;
        }

        /* Top Section */
        .profile-img {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            margin: 0 auto 24px;
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            /* Remove border if you have a transparent PNG/SVG */
        }

        .name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .title {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .value-prop {
            font-size: 1rem;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 32px;
            padding: 0 12px;
            font-weight: 400;
        }

        /* Action Buttons */
        .buttons-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.1s ease, background-color 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
            outline: none;
            -webkit-tap-highlight-color: transparent; /* Remove mobile tap highlight */
        }

        .btn:active {
            transform: scale(0.97); /* Subtle tap feedback */
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: var(--accent-text);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--btn-bg);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--btn-hover);
        }

        .btn-icon {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Micro Proof */
        .micro-proof {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .micro-proof::before, .micro-proof::after {
            content: "";
            display: block;
            width: 24px;
            height: 1px;
            background-color: var(--border-color);
        }
    </style>
</head>
<body>

    <main class="card">

        <img src="Profile Picture.png" alt="Saurabh Saini" class="profile-img">

        <!-- 2. TOP SECTION -->
        <h1 class="name">Saurabh Saini</h1>

                <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.16-3.8c-1.1 0-1.83.58-2.15 1.1v-.9h-2.39v9h2.39v-4.73c0-1.2.22-2.39 1.62-2.39 1.34 0 1.36 1.41 1.36 2.47v4.73h2.33M7.34 8.22c.76 0 1.38-.63 1.38-1.39A1.39 1.39 0 1 0 7.34 8.22M8.54 18.5h-2.4v-9h2.4v9z"/></svg>

        <!-- 4. MICRO-PROOF -->

    <!-- Ultra-lightweight JS strictly for vCard generation -->
    <script>
        function downloadVCard() {
            // ---> UPDATE YOUR CONTACT DETAILS HERE <---
            const contact = {
                firstName: "Saurabh",
                lastName: "Saini",
                phone: "+1 905-781-2687", // Important for Save Contact
                email: "saurabhsaini789@gmail.com",
                title: "Instructional Designer",
                url: "https://iamsaurabhsaini.com/",
                linkedin: "https://www.linkedin.com/in/iamsaurabhsaini/"
            };

            // Formatting vCard 3.0 String
            const vcard = `BEGIN:VCARD
VERSION:3.0
N:${contact.lastName};${contact.firstName};;;
FN:${contact.firstName} ${contact.lastName}
TITLE:${contact.title}
TEL;TYPE=CELL:${contact.phone}
EMAIL;TYPE=WORK:${contact.email}
URL:${contact.url}
URL;TYPE=LinkedIn:${contact.linkedin}
END:VCARD`;

            // Create Blob and trigger instant download
            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${contact.firstName}_${contact.lastName}.vcf`;
            document.body.appendChild(a);
            a.click();
            
            // Clean up
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }
    </script>
</body>
</html>
